version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /backend
      - /backend/antirudechat
      - /backend/clipnsfw
      - /backend/kvmatching
      - /backend/minorconfession
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
