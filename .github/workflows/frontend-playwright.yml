name: Frontend Playwright Tests
on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - backend/**
      - Makefile
      - .github/workflows/frontend-playwright.yml
  pull_request:
    paths:
      - frontend/**
      - backend/**
      - Makefile
      - .github/workflows/frontend-playwright.yml

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop screens
            artifact: desktop
            projects: desktop
          - name: phone screens
            artifact: phone
            projects: phone
          - name: onboarding
            artifact: onboarding
            projects: onboarding-desktop onboarding-phone
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Start backend
      run: make e2e-backend > /tmp/compose.log 2>&1 &
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies and Playwright's Chromium
      run: make install
    - name: Run Playwright tests
      run: make frontend-e2e PROJECTS='${{ matrix.projects }}'
    - name: Show backend logs
      if: failure()
      working-directory: backend
      run: |
        cat /tmp/compose.log
        docker compose -f docker-compose.test.yml logs api
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.artifact }}
        path: |
          frontend/playwright-report/
          frontend/test-results/
          frontend/playwright-tests/*-snapshots/
        retention-days: 30
