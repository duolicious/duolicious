name: Backend Tests

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-test.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-test.yml

# All run-steps below execute from the backend subdirectory, so the
# relative paths inherited from the original backend repo
# (./mypy.sh, ./test/...) resolve unchanged.
defaults:
  run:
    working-directory: backend

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: backend/.python-version
    - run: ./check-python-version.sh
    - run: ./mypy.sh

  functionality-tests:
    name: functionality-tests-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        include:
          - suite: 2
            cron_cleaner_dry_run: 'true'

    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Run functionality tests
        run: ./test/util/with-container.sh ./test/functionality.sh ${{ matrix.suite }}
        env:
          DUO_EMAIL_KEY: 'not-a-real-key'
          DUO_EMAIL_URL: 'https://example.com'

          DUO_R2_BUCKET_NAME: s3-mock-bucket
          DUO_R2_ACCT_ID: unused-in-dev-env
          DUO_R2_ACCESS_KEY_ID: s3-mock-access-key-id
          DUO_R2_ACCESS_KEY_SECRET: s3-mock-secret-access-key-secret

          # Empty outside suite 2, which the compose file reads as unset.
          DUO_CRON_PHOTO_CLEANER_DRY_RUN: ${{ matrix.cron_cleaner_dry_run }}
          DUO_CRON_AUDIO_CLEANER_DRY_RUN: ${{ matrix.cron_cleaner_dry_run }}

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: ./test/util/with-container.sh ./test/unit/unit.sh --no-sudo
        env:
          DUO_EMAIL_KEY: 'not-a-real-key'
          DUO_EMAIL_URL: 'https://example.com'

          DUO_R2_BUCKET_NAME: s3-mock-bucket
          DUO_R2_ACCT_ID: unused-in-dev-env
          DUO_R2_ACCESS_KEY_ID: s3-mock-access-key-id
          DUO_R2_ACCESS_KEY_SECRET: s3-mock-secret-access-key-secret
