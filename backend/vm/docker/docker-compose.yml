version: '3.8'

services:
  api:
    image: us-east1-docker.pkg.dev/duolicious/api/{{branch}}:{{commit_sha}}
    ports:
      - "5000:5000"
    env_file:
      - .env

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cron:
    image: us-east1-docker.pkg.dev/duolicious/cron/main:{{branch}}:{{commit_sha}}
    ports:
      - "8082:8080"
    env_file:
      - .env

  firehol:
    image: us-east1-docker.pkg.dev/duolicious/firehol/{{branch}}:{{commit_sha}}
    ports:
      - "5070:5070"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5070/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    driver: bridge

